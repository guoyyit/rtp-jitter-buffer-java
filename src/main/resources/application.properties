spring.application.name=rtp-jitter-buffer

# --- RTP receiver / jitter buffer configuration -----------------------------
# RTP clock rate in Hz used to translate RTP timestamps to wall time (8000 PCM).
rtp.clock-rate=8000
# Static payload type accepted by sessions; dynamic PTs 96-127 must be listed.
rtp.payload-type=0
# Hard cap on packets buffered across ALL sessions (global memory bound).
rtp.global-max-buffered-packets=16384
# Maximum simultaneously tracked SSRCs per session.
rtp.max-ssrcs=32
# Per-session buffered packet cap (independent of the global cap).
rtp.max-packets-per-session=4096
# Per-SSRC buffered packet cap.
rtp.max-packets-per-ssrc=512
# Out-of-order packets farther than this many sequence numbers are dropped.
rtp.reorder-window-packets=64
# Adaptive playout delay bounds and starting point.
rtp.min-delay=10ms
rtp.initial-delay=60ms
rtp.max-delay=400ms
# Period between compound RTCP reports.
rtp.rtcp-interval=5s
